<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{layout :: navbar}"></div>

<div class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-gcard rounded-2xl p-8 border border-purple-900/30 neon-glow">
        <h1 class="text-3xl font-bold text-center mb-2">Join GameFlix</h1>
        <p class="text-gray-400 text-center mb-8">Create your account and start playing</p>

        <form id="registerForm" class="space-y-5" onsubmit="return validateRegister(event)">
            <div>
                <label class="block text-sm mb-2 text-gray-300">Username</label>
                <input type="text" id="username" required minlength="3" maxlength="50"
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <div>
                <label class="block text-sm mb-2 text-gray-300">Email</label>
                <input type="email" id="email" required
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <div>
                <label class="block text-sm mb-2 text-gray-300">Password</label>
                <input type="password" id="password" required minlength="8"
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <div>
                <label class="block text-sm mb-2 text-gray-300">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="8"
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <p id="registerError" class="text-red-400 text-sm hidden"></p>
            <p id="registerSuccess" class="text-emerald-400 text-sm hidden"></p>
            <button type="submit" class="w-full py-3 bg-gaccent rounded-lg font-semibold hover:bg-purple-700 transition">
                Create Account
            </button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-6">
            Already have an account? <a href="/login" class="text-gneon hover:underline">Sign in</a>
        </p>
    </div>
</div>

<script>
async function validateRegister(event) {
    event.preventDefault();
    const errorEl = document.getElementById('registerError');
    const successEl = document.getElementById('registerSuccess');
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return false;
    }

    const payload = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: password
    };

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
            successEl.textContent = 'Account created! Redirecting to login...';
            successEl.classList.remove('hidden');
            setTimeout(() => window.location.href = '/login', 2000);
        } else {
            errorEl.textContent = data.message || 'Registration failed.';
            errorEl.classList.remove('hidden');
        }
    } catch (e) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('hidden');
    }
    return false;
}
</script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
