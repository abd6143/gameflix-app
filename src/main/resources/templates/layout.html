<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | GameFlix'">GameFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gbg: '#0d0d0d', gcard: '#1a1a2e', gaccent: '#7c3aed', gneon: '#a78bfa', gtext: '#e2e8f0' } } } }
    </script>
    <style>
        body { background-color: #0d0d0d; color: #e2e8f0; }
        .neon-glow { box-shadow: 0 0 20px rgba(124, 58, 237, 0.3); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 0 25px rgba(167, 139, 250, 0.25); transition: all 0.2s; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="bg-gcard border-b border-purple-900/40 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <a href="/" class="text-2xl font-bold text-gneon tracking-tight">Game<span class="text-gaccent">Flix</span></a>
                <div class="hidden md:flex gap-6">
                    <a href="/catalog" class="hover:text-gneon transition">Catalog</a>
                    <a href="/subscription" class="hover:text-gneon transition" sec:authorize="isAuthenticated()">Subscription</a>
                    <a href="/admin/dashboard" class="hover:text-gneon transition" sec:authorize="hasRole('ADMIN')">Admin</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="px-4 py-2 text-sm hover:text-gneon">Login</a>
                    <a href="/register" class="px-4 py-2 text-sm bg-gaccent rounded-lg hover:bg-purple-700 transition">Sign Up</a>
                </div>
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
                    <a href="/dashboard" class="text-sm hover:text-gneon" sec:authentication="name">User</a>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-sm text-red-400 hover:text-red-300">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<aside th:fragment="sidebar" class="hidden lg:block w-64 bg-gcard border-r border-purple-900/30 p-6 min-h-full">
    <nav class="space-y-2">
        <a href="/dashboard" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">Dashboard</a>
        <a href="/catalog" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">Browse Catalog</a>
        <a href="/subscription" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">My Subscription</a>
        <div sec:authorize="hasRole('ADMIN')" class="pt-4 border-t border-purple-800/30 mt-4">
            <p class="text-xs text-gray-500 uppercase mb-2 px-4">Admin</p>
            <a href="/admin/dashboard" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">Dashboard</a>
            <a href="/admin/games" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">Manage Games</a>
            <a href="/admin/users" class="block px-4 py-2 rounded-lg hover:bg-purple-900/30 transition">Manage Users</a>
        </div>
    </nav>
</aside>

<footer th:fragment="footer" class="bg-gcard border-t border-purple-900/30 py-8 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-400 text-sm">
        <p>&copy; 2026 GameFlix. Your Games. One Subscription.</p>
        <p class="mt-2"><a href="/swagger-ui.html" class="text-gneon hover:underline">API Docs</a></p>
    </div>
</footer>

</body>
</html>
