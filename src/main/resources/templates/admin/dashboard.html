<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Admin Dashboard')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{layout :: navbar}"></div>

<div class="flex flex-1">
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="flex-1 p-6 lg:p-10">
        <h1 class="text-3xl font-bold mb-8">Admin Dashboard</h1>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <p class="text-gray-400 text-sm">Total Users</p>
                <p class="text-3xl font-bold text-gneon mt-2" th:text="${stats.totalUsers}">0</p>
            </div>
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <p class="text-gray-400 text-sm">Active Subscriptions</p>
                <p class="text-3xl font-bold text-emerald-400 mt-2" th:text="${stats.activeSubscriptions}">0</p>
            </div>
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <p class="text-gray-400 text-sm">Monthly Revenue</p>
                <p class="text-3xl font-bold text-gneon mt-2" th:text="'$' + ${stats.monthlyRevenue}">$0</p>
            </div>
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <p class="text-gray-400 text-sm">Total Games</p>
                <p class="text-3xl font-bold text-gneon mt-2" th:text="${stats.totalGames}">0</p>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <h2 class="text-lg font-semibold mb-4">Recent Sign-ups</h2>
                <table class="w-full text-sm">
                    <thead><tr class="text-gray-400"><th class="text-left py-2">User</th><th class="text-left py-2">Email</th><th class="text-left py-2">Plan</th></tr></thead>
                    <tbody>
                        <tr th:each="u : ${users}" class="border-t border-purple-900/20">
                            <td class="py-2" th:text="${u.username}">user</td>
                            <td class="py-2 text-gray-400" th:text="${u.email}">email</td>
                            <td class="py-2"><span class="text-xs px-2 py-1 rounded bg-purple-900/40" th:text="${u.planName != null ? u.planName : 'None'}">None</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="bg-gcard rounded-xl p-6 border border-purple-900/30">
                <h2 class="text-lg font-semibold mb-4">Subscription Status</h2>
                <canvas id="statusChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
const users = /*[[${users}]]*/ [];
const active = users.filter(u => u.subscriptionStatus === 'ACTIVE').length;
const paused = users.filter(u => u.subscriptionStatus === 'PAUSED').length;
const cancelled = users.filter(u => u.subscriptionStatus === 'CANCELLED').length;
const none = users.length - active - paused - cancelled;

new Chart(document.getElementById('statusChart'), {
    type: 'pie',
    data: {
        labels: ['Active', 'Paused', 'Cancelled', 'None'],
        datasets: [{ data: [active, paused, cancelled, none], backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#4b5563'] }]
    },
    options: { plugins: { legend: { labels: { color: '#e2e8f0' } } } }
});
</script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
