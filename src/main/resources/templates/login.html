<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body class="min-h-screen flex flex-col">
<div th:replace="~{layout :: navbar}"></div>

<div class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-gcard rounded-2xl p-8 border border-purple-900/30 neon-glow">
        <h1 class="text-3xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-gray-400 text-center mb-8">Sign in to your GameFlix account</p>

        <div th:if="${error}" class="mb-4 p-3 bg-red-900/30 border border-red-500/50 rounded-lg text-red-300 text-sm">
            Invalid email or password. Please try again.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div>
                <label class="block text-sm mb-2 text-gray-300">Email</label>
                <input type="email" name="username" required
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <div>
                <label class="block text-sm mb-2 text-gray-300">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 bg-gbg border border-purple-800/50 rounded-lg focus:outline-none focus:border-gaccent"/>
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-gray-400">
                    <input type="checkbox" name="remember-me" class="rounded"/>
                    Remember me
                </label>
                <a href="/register" class="text-gneon hover:underline">Create account</a>
            </div>
            <button type="submit" class="w-full py-3 bg-gaccent rounded-lg font-semibold hover:bg-purple-700 transition">
                Sign In
            </button>
        </form>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
